# Upstream with a keep-alive pool to FastAPI. Reusing pooled connections instead
# of opening a fresh TCP connection per request is what removes the multi-second
# "Initial connection" stalls seen over the network: with broken keep-alive every
# request paid for a new TCP handshake, and over a latent/lossy link some of
# those handshakes hung up to the client timeout.
upstream fastapi_backend {
    server fastapi_v2:8001;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Keep client connections alive long enough to be reused across the SPA's
    # request fan-out, so the browser does not keep opening new connections.
    keepalive_timeout 65s;
    keepalive_requests 1000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # update_data — long-running, extended timeout
    location /api/update_data {
        proxy_pass http://fastapi_backend/update_data;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # All API requests — strip /api prefix before passing to FastAPI.
    # No WebSocket upgrade here (the SPA uses fetch/XHR), so we clear the
    # Connection header — `proxy_http_version 1.1` + `Connection ""` is the
    # required combo to actually reuse the upstream keep-alive pool.
    location /api/ {
        proxy_pass http://fastapi_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
